COURSES.E.days[8]={day:9,date:"9/24 목",city:"브라이에스+트레치메",theme:"브라이에스 아침 보트 + 트레치메 트레킹 + 카디니 전망대",routeSummary:"🚗 Braies 아침(거울수면·보트)→(미수리나 통과)→Auronzo 게이트 10:30 슬롯→트레치메 일주 9.5km→Cadini 전망대→Cortina (날짜 고정: 통행료 예약)",sched:[
  {t:"06:50",name:"코르티나 출발 (도시락 지참)",actions:[{t:"🗺 →브라이에스",u:"https://www.google.com/maps/dir/?api=1&origin=Cortina+d'Ampezzo&destination=Lago+di+Braies&travelmode=driving"}],desc:"아침 파니노/도시락 챙겨 조기 출발",type:"move",coords:[46.5369,12.1357],map:false,tip:"브라이에스 선행 이유: 바람 없는 오전이 거울 수면+보트 최적이고 주차도 여유. Rifugio 점심은 9월말 시즌 마감 임박 → 백업 파니노 필수."},
  {t:"08:00~10:00",name:"라고 디 브라이에스 — 아침 보트 + 호수 일주",desc:"에메랄드 호수 · 나무보트 · 일주 3.5km ~1h",type:"hl",coords:[46.6944,12.0853],tip:"💡2026 차량 예약제는 7/1~9/15 09:00~16:00 구간만 적용 — 9/24는 예약 없이 자유진입. P4 주차(호수 100m) 현장결제 €8/3h, 이후 €0.80/30분·일 최대 €30. 보트하우스 오픈 직후가 가장 잔잔."},
  {t:"10:00~11:00",name:"브라이에스 → (미수리나 통과) → Auronzo 게이트",actions:[{t:"🗺 Google 경로",u:"https://www.google.com/maps/dir/?api=1&origin=Lago+di+Braies&destination=Rifugio+Auronzo&travelmode=driving&waypoints=Lago+di+Misurina"}],desc:"약 55분 · 차량 €40 · 온라인 사전예약 필수 · 차량번호 입력",type:"move",coords:[46.6156,12.2953],map:false,tip:"⏳예약 가능 시점: 캘린더가 약 1개월 롤링이라 9/24는 8/22~8/25경 열린다(실측: 9/3까지만 열림). 8/20부터 매일 확인. 🎯슬롯은 10:30(30분 단위면) 또는 10:00(1시간 단위면)으로 잡을 것 — ⚠️규정이 비대칭이다예약시각보다 '일찍' 오면 진입 거부(이전 시간대 차량이 자리를 쓰고 있을 수 있어서), '늦게' 오면 그대로 진입 가능하고 종료시각만 원래 예약 기준 유지. 즉 지각은 무료·조기도착은 대기. 우리 게이트 도착은 10:25(브라이에스 조기 종료)~11:30(지연) 범위라, 11:00을 잡으면 조기 도착 시 최대 35분 대기하지만 10:30이면 어느 경우에도 손해가 없다. 12h 유효라 10:30 진입이면 22:30까지 — 16:30 하산이라 무관. ✅5일 전(9/19)까지 무료 취소·환불이라 지금 잡아도 무위험 — 그 이후엔 취소 불가. 날짜 '변경'은 불가(취소 후 재예약). 번호판은 전날 23:59까지 1회 수정. 12h 유효. 주차 700대. 도중 미수리나 호수를 통과하므로 경유 손실 0. 🔁취소했을 때 백업: 미수리나발 셔틀 €10/인·예약 불필요(9/10부터 감축 운행 — 시각표 현지 확인)."},
  {t:"11:00~14:30",name:"트레치메 일주 트레킹 (봉우리 '둘레길')",desc:"9.5~10km · 누적 340~430m · 3~3.5h · 난이도 中 · 반시계방향",type:"spot",coords:[46.6172,12.2942],tip:"⚠️정상 등반이 아니라 세 봉우리 발치를 한 바퀴 도는 둘레길이다(치마 그란데 2,999m 등은 전문 암벽 루트). 반시계방향 권장 — 내내 봉우리를 마주보게 됨. 고도: 아우론조 산장 2,333m(주차) → Rif. Lavaredo 2,344m → 포르첼라 라바레도 2,454m(최고점) → Rif. Locatelli 2,405m(★북벽 정면, 이 트레킹의 이유) → Malga Langalm 2,232m(최저) → Forc. Col de Mezzo 2,254m → 주차장 복귀. 주차장에서 보이는 건 남벽이라 세 봉우리가 한 덩어리로 보임 — 그 유명한 '세 개의 탑' 얼굴은 반대편 Locatelli에서만 나온다. 무릎 부담 시 Locatelli 왕복(약 6km, 같은 길)으로 단축, 비트레킹이면 주차장 자체도 전망대."},
  {t:"12:30",name:"Rifugio Locatelli 전망 + 점심",desc:"트레치메 북벽 정면 · 산장 점심/도시락",type:"food",coords:[46.6181,12.305],tip:"이 트레킹의 하이라이트 포인트. 9월말 영업 재확인 — 마감 시 지참 도시락."},
  {t:"14:40~16:30",name:"카디니 디 미수리나 전망대 (트레일 117)",desc:"같은 Auronzo 주차장에서 남쪽 · 편도 40분/왕복 3.2km · 추가비용 0",type:"hl",coords:[46.6055,12.3060],tip:"⚠️'카디니 디 미수리나'는 산군 이름 — 아래 미수리나 호수(1,754m)가 아니라 주차장에서 걸어가는 전망대다. 순환로를 마치고 주차장에 돌아온 뒤 반대쪽으로 나가는 별도 왕복. 편도 40분이라 전망대 체류까지 1h50~2h 잡을 것(기존 80분 배정은 순수 보행시간뿐이었음). 코스: Forcella Longeres로 살짝 내려섰다가 완만히 올라 좁고 노출된 암반 구간 → 전망대 곶. '창끝 침봉' 인생샷, 뒤돌면 트레치메 남벽. 오후빛 순광. ⚠️전망대에서 멈출 것 — Rifugio Fonda Savio 쪽으로 더 가면 Bonacossa 정식 비아페라타(사다리·노출 구간)로 바뀐다. 지치면 15분만 걸어도 뷰가 열림."},
  {t:"16:30~17:30",name:"코르티나 복귀",actions:[{t:"🗺 Google 경로",u:"https://www.google.com/maps/dir/?api=1&origin=Rifugio+Auronzo&destination=Cortina+d'Ampezzo&travelmode=driving"}],desc:"약 50분 · 미수리나 호수 지나 하산",type:"move",coords:[46.5369,12.1357],map:false,tip:"오늘 총 보행 약 13km(순환 9.5~10km + 카디니 3.2km)에 06:50 출발이라 이 여행 최대 활동일. 저녁 19:30 예약이면 여유 2h."},
  {t:"19:30",name:"저녁: El Brite de Larieto / Tivoli★",rk:"dolomiti-dinner",desc:"El Brite 수요일 휴무 · 목요일 영업 여부 전화 확인 필수 · €90~120",type:"food",coords:[46.5566,12.1430],tip:"코르티나 마지막 밤 — El Brite(+39 368 7008083) 1순위, 목요일 디너 운영 확인 필요. 불가 시 Ristorante Tivoli(미슐랭★, 월 휴무·목 영업) 또는 SanBrite. 카준치에이(비트 라비올리) 필수."}
],cost:"€230~280"};

  {t:"12:30~12:50",name:"세체다 케이블카 (Ortisei→Furnes→Seceda)",desc:"왕복 €74/인 + 능선 트레일 €5/인 · 30분 슬롯 의무 · ★12:30 슬롯(조기 출발 반영)",type:"move",coords:[46.5770,11.6745],tip:"운영 08:30~18:00(공식 seceda.it). 전날 예보 보고 구매하되 아침 진행 보고 12:00~13:00 사이 선택 — 조기도착은 진입 거부·지각은 허용이라 이른 슬롯이 항상 안전. seceda.axess.shop 온라인 −5%."},

{n:"AVM Venezia Official",tag:"바포레토 공식",d:"바포레토 24h권을 앱에서 사고 폰 QR로 개찰 — 산마르코 매표소 줄을 통째로 스킵. D7 도착·곤돌라 이동과 D8 아침 동선에 사용.",tip:"티켓은 구매 후 '탑승 직전 활성화' 방식 — 첫 탑승 때 활성화해야 24시간이 그때부터 계산됨(D7 14시 활성화→D8 오전 역 이동까지 커버). D8 S.Lucia→Mestre 기차는 Trenitalia 앱에서 별도 구매.",links:[["AVM Venezia","https://avm.avmspa.it/en/content/avm-venezia-official-app"]]}
]},
{title:"🚗 렌터카·드라이브 (D9~D12 돌로미티)",items:[
{n:"EasyPark",tag:"노상주차 결제",d:"이탈리아 650+ 도시의 파란선 노상주차를 앱으로 분단위 결제. 코르티나·바레나·밀라노에서 주차미터기·타바키 찾아 헤맬 필요 없음. 만료 15분 전 알림+원격 연장.",tip:"⚠️ 렌터카 번호판 등록 후 반납일에 반드시 삭제 — 안 하면 남이 그 번호로 주차할 때 결제됨.",links:[["EasyPark","https://www.easypark.com/en-it"]]},
{n:"Waze",tag:"운전 내비",d:"ZTL(도심 통행제한)·단속카메라·사고 경고가 구글맵보다 빠름. 코르티나 시내 ZTL, 밀라노 Area C 회피에 유용.",tip:"렌터카 ZTL 벌금은 건당 최대 €330 + 렌터카사 행정수수료 — 내비가 ZTL 근처로 안내하면 의심부터.",links:[["Waze","https://www.waze.com"]]},
{n:"Prezzi Benzina",tag:"주유소 가격비교",d:"주변 주유소 가솔린 실시간 가격 비교. 밀라노 반납 전 full-to-full 주유(D12) 때 고속도로 주유소(비쌈) 피해서 급유.",tip:"셀프(Self)와 주유원(Servito) 가격이 다름 — Self 선택.",links:[["Prezzi Benzina","https://www.prezzibenzina.it"]]}
]},
{title:"💳 결제·환전 (한국인 특화)",items:[
{n:"트래블로그 / 트래블월렛",tag:"환전 카드",d:"유로 미리 충전해서 결제·ATM 인출 수수료를 없애는 한국인 표준 조합. 로마 지하철·밀라노 트램은 개찰구에 이 카드 컨택리스 탭만 하면 됨(별도 교통앱 불필요).",tip:"결제기가 원화(KRW)를 물어보면 무조건 거부하고 EUR 선택(DCC 수수료 3~7% 함정). ATM은 은행 지점 부설만 사용(Euronet 회피).",links:[["트래블로그","https://m.hanacard.co.kr"],["트래블월렛","https://www.travel-wallet.com"]]},
{n:"Global Blue",tag:"택스리펀",d:"D13 밀라노 쇼핑 후 택스리펀 추적·환급 카드 등록. 매장에서 여권 제시→앱으로 환급 상태 확인, MXP 공항 전자검증(키오스크) 위치 안내.",tip:"공항 3~4시간 전 도착 계획(D13 반영됨)에 리펀 창구 줄 포함해서 움직일 것. 미개봉 상태 유지.",links:[["Global Blue","https://www.globalblue.com"]]}
]},
{title:"📶 통신·식당·날씨·안전",items:[
{n:"eSIM (Airalo 등)",tag:"통신",d:"출국 전 설치해 착륙 즉시 개통. 듀얼심으로 한국 번호 수신 유지(은행 인증 SMS). 한국계(도시락eSIM·유심사 등)는 카톡 상담 가능.",tip:"12박이면 유럽 통합 10GB+ 요금제 권장 — 지도·번역이 데이터를 생각보다 많이 씀. 물리심 교체형보다 eSIM이 분실 리스크 0.",links:[["Airalo","https://www.airalo.com"]]},
{n:"TheFork",tag:"식당 예약",d:"이탈리아 식당 예약 표준 앱(미쉐린~동네 트라토리아). 예약 가능 시간 실시간 확인 + 최대 30~50% 할인 식당 필터.",tip:"이 일정의 핵심 식당(Buca Mario·Boccadoro 등)은 공식 채널 예약이 우선이고, TheFork는 '당일 빈자리 찾기+할인'용으로.",links:[["TheFork","https://www.thefork.it"]]},
{n:"3B Meteo",tag:"이탈리아 로컬 날씨",d:"이탈리아 로컬 기상 서비스 — 산악 지역 정확도가 글로벌 앱보다 좋음. D6 친퀘테레 우천 전환 판단, D10~11 돌로미티 스왑 판단(트레치메 vs 드라이브)에 사용.",tip:"돌로미티는 시간대별 예보로 확인 — 오전 맑음/오후 소나기 패턴이 흔함.",links:[["3B Meteo","https://www.3bmeteo.com"]]},
{n:"해외안전여행 (외교부)",tag:"안전",d:"영사콜센터 무료전화(앱 내 버튼), 여권 분실·긴급 상황 매뉴얼, 이탈리아 안전공지 푸시.",tip:"이탈리아 긴급번호 112. 로마 테르미니역·바티칸 주변 소매치기 다발 — 위급 시 영사콜센터 +82-2-3210-0404.",links:[["해외안전여행","https://www.0404.go.kr"]]}

function decPoly(str){let i=0,lat=0,lng=0,pts=[];while(i<str.length){let b,sh=0,res=0;do{b=str.charCodeAt(i++)-63;res|=(b&0x1f)<<sh;sh+=5;}while(b>=0x20);lat+=(res&1)?~(res>>1):(res>>1);sh=0;res=0;do{b=str.charCodeAt(i++)-63;res|=(b&0x1f)<<sh;sh+=5;}while(b>=0x20);lng+=(res&1)?~(res>>1):(res>>1);pts.push([lat/1e5,lng/1e5]);}return pts;}
function realPath(coords){
  const out=[];
  for(let i=0;i<coords.length-1;i++){
    const a=coords[i],b=coords[i+1];
    const k=Number(a[0]).toFixed(4)+','+Number(a[1]).toFixed(4)+'|'+Number(b[0]).toFixed(4)+','+Number(b[1]).toFixed(4);
    if(!out.length)out.push([Number(a[0]),Number(a[1])]);
    const g=ROUTE_GEOM[k];
    if(g)decPoly(g).forEach(pt=>out.push(pt));
    out.push([Number(b[0]),Number(b[1])]);
  }
  return out.length?out:coords;
}
function coordKeyFromCoords(c){return `${Number(c[0]).toFixed(5)},${Number(c[1]).toFixed(5)}`;}
function coordKey(s){return coordKeyFromCoords(s.coords);}
function sameCoords(a,b){
  return !!(a&&b&&isCoord(a.coords)&&isCoord(b.coords)&&Math.abs(Number(a.coords[0])-Number(b.coords[0]))<0.00025&&Math.abs(Number(a.coords[1])-Number(b.coords[1]))<0.00025);
}
function pointLabel(s){
  if(!s)return '';
  return s.place||s.pinName||(s.name||'지점').replace(/^선택:\s*/,'').replace(/⭐\s*/g,'').replace(/\s*\(.*?선택.*?\)/g,'');
}
function distanceKm(a,b){
  const R=6371,lat1=Number(a[0])*Math.PI/180,lat2=Number(b[0])*Math.PI/180;
  const dLat=lat2-lat1,dLng=(Number(b[1])-Number(a[1]))*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function firstDuration(text){
  const m=String(text||'').match(/(?:약\s*)?\d+(?:~\d+)?\s*(?:시간(?:\s*\d+\s*분)?|분)/);
  return m?m[0].replace(/\s+/g,' '):'';
}
function travelModeText(s){
  const text=`${s?.name||''} ${s?.desc||''}`;
  const modes=[];
  if(/택시/.test(text))modes.push('택시');
  if(/도보/.test(text))modes.push('도보');
  if(/Metro|메트로|지하철/.test(text))modes.push('메트로');
  if(/Italo|Frecciarossa|Regionale|열차|기차/.test(text))modes.push('열차');
  if(/바포레토|vaporetto/i.test(text))modes.push('바포레토');
  if(/렌터카|차량|드라이브|차\b/.test(text))modes.push('차량');
  if(/비행|KE9|공항/.test(text))modes.push('공항 이동');
  return [...new Set(modes)].slice(0,2).join('/');
}
function travelDetail(prev,s){
  if(s.moveInfo)return s.moveInfo;
  const text=`${s?.name||''} ${s?.desc||''}`;
  const mode=travelModeText(s);
  const transportContext=s?.type==='move'||/→|이동|도보|택시|Metro|메트로|지하철|Italo|Frecciarossa|Regionale|열차|기차|바포레토|vaporetto|렌터카|차량|드라이브|공항/i.test(text);
  const explicit=transportContext?firstDuration(text):'';
  if(explicit)return `${mode?mode+' ':''}${explicit}`;
  if(!prev||!isCoord(prev.coords)||!isCoord(s.coords))return mode||'이동';
  const km=distanceKm(prev.coords,s.coords);
  if(km<0.08)return '';
  if(km<1.2)return `도보 약 ${Math.max(4,Math.round(km/4.2*60+3))}분`;
  if(km<3.5){
    const walk=Math.round(km/4.2*60),fast=Math.round(km/20*60+8);
    return `${mode||'도보/택시'} 약 ${Math.min(walk,fast)}~${Math.max(walk,fast)}분`;
  }
  if(km<35)return `${mode||'차량/대중교통'} 약 ${Math.max(15,Math.round(km/35*60))}분`;
  return mode||'장거리 이동';
}
function isItineraryVisible(){const el=document.getElementById('sec-itinerary');return !!(el&&el.classList.contains('active')&&el.offsetParent!==null);}

function createNumberedIcon(num,type,offset={dx:0,dy:0}){
  const color=ICON_COLORS[type]||'#6b7280';
  const label=String(num);
  const width=label.length>2?34:24;
  const dx=Number(offset.dx)||0,dy=Number(offset.dy)||0;
  const shifted=Math.abs(dx)>1||Math.abs(dy)>1;
  const angle=Math.atan2(dy,dx)*180/Math.PI;
  const leaderWidth=Math.max(0,Math.hypot(dx,dy)-10);
  const leader=shifted?`<span class="day-marker-leader" style="width:${leaderWidth}px;transform:rotate(${angle}deg)"></span><span class="day-marker-dot"></span>`:'';
  return L.divIcon({className:'day-marker-icon',html:`<div class="day-marker-wrap${shifted?' shifted':''}" style="--dx:${dx}px;--dy:${dy}px;--w:${width}px;--hw:${width/2}px;--c:${color}">${leader}<span class="day-marker-label">${label}</span></div>`,iconSize:[1,1],iconAnchor:[0,0],popupAnchor:[dx,dy-16]});
}
function routeAnchorLabel(s){
  return s.pin||(s.type==='hotel'?'H':s.type==='move'?'↔':s.type==='food'?'F':'•');
}
function routeAnchorType(s){
  return s.type==='hotel'?'hotel':s.type==='food'?'food':'move';
}
function createRouteAnchorIcon(s){
  return L.divIcon({className:'route-anchor-icon',html:`<div class="route-anchor-dot ${routeAnchorType(s)}">${routeAnchorLabel(s)}</div>`,iconSize:[20,20],iconAnchor:[10,10],popupAnchor:[0,-12]});
}
function createRouteArrowIcon(angle){
  return L.divIcon({className:'route-arrow-icon',html:`<div class="route-arrow-chip" style="--angle:${angle}deg">➜</div>`,iconSize:[18,18],iconAnchor:[9,9],popupAnchor:[0,-10]});
}

function slBook(u,ci,co){return u?u.split('?')[0]+"?checkin="+ci+"&checkout="+co+"&"+SL_PAX+"&selected_currency=EUR":"";}
function slAgoda(u,name,city,ci,los){return u?u.split('?')[0]+"?checkIn="+ci+"&los="+los+"&adults=2&rooms=1":"https://www.agoda.com/search?textToSearch="+encodeURIComponent(name+" "+city)+"&checkIn="+ci+"&los="+los+"&adults=2&rooms=1";}
function slHotels(name,city,ci,co){return "https://www.hotels.com/Hotel-Search?destination="+encodeURIComponent(name+" "+city)+"&startDate="+ci+"&endDate="+co+"&adults=2";}
function slTrip(name,city,ci,co){return "https://www.trip.com/hotels/list?keyword="+encodeURIComponent(name+" "+city)+"&checkin="+ci+"&checkout="+co+"&crn=1&adult=2";}
function slGoogle(name,city,ci,co){return "https://www.google.com/travel/search?q="+encodeURIComponent(name+" "+city)+"%20"+ci+"%20"+co;}
function slMaps(name,city){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(name+" "+city);}
function slScore(k,v){const n=parseFloat(v);const cls=n>=9.3?"hi":(n>=8.8?"mid":"");return '<div class="sl-sc"><div class="v '+cls+'">'+(v||"-")+'</div><div class="k">'+k+'</div></div>';}
function slToggleRow(id,el){const d=document.getElementById(id);if(!d)return;d.hidden=!d.hidden;el.classList.toggle('open',!d.hidden);}
function slTable(L){
  return '<div class="slt">'+L.hotels.map((h,i)=>{
    const id='slt-'+L.key+'-'+i;
    const bk=slBook(h.book,L.ci,L.co),ag=slAgoda(h.agoda,h.name,L.city,L.ci,L.los),gg=slGoogle(h.name,L.city,L.ci,L.co),mp=slMaps(h.name,L.city);
    const badge=(h.hold?'<span class="slt-b hold">가예약</span>':'')+(h.cancel&&!/요율|확인/.test(h.cancel)?'<span class="slt-b fc">무취</span>':'');
    const scores=[["종합",h.ov],["청결",h.cl],["서비스",h.sv],["위치",h.lo]].filter(x=>x[1]).map(x=>`<span class="slt-sco"><b>${x[1]}</b>${x[0]}</span>`).join('');
    const links=`<a href="${gg}" target="_blank" rel="noopener" class="sl-lk book" onclick="event.stopPropagation()">Google 비교 ▸날짜</a>`
      +(bk?`<a href="${bk}" target="_blank" rel="noopener" class="sl-lk" onclick="event.stopPropagation()">Booking</a>`:'')
      +`<a href="${ag}" target="_blank" rel="noopener" class="sl-lk" onclick="event.stopPropagation()">Agoda</a>`
      +(h.off?`<a href="${h.off}" target="_blank" rel="noopener" class="sl-lk" onclick="event.stopPropagation()">공식</a>`:'')
      +`<a href="${mp}" target="_blank" rel="noopener" class="sl-lk" onclick="event.stopPropagation()">지도</a>`;
    return `<div class="slt-row" onclick="slToggleRow('${id}',this)">`
      +`<span class="slt-rank">#${i+1}</span>`
      +`<span class="slt-nm">${h.name}${h.stars?` <span class="slt-st">${'★'.repeat(h.stars)}</span>`:''} ${badge}</span>`
      +`<span class="slt-pr">${h.price}</span>`
      +`<span class="slt-sc"><b>${h.ov}</b><small>(${h.cnt})</small></span>`
      +`<span class="slt-ch">▾</span></div>`
      +`<div class="slt-det" id="${id}" hidden>`
      +`<div class="slt-drow">${h.area}</div>`
      +`<div class="slt-drow">📍 ${h.dist}</div>`
      +`<div class="slt-scores">${scores}</div>`
      +(h.why?`<div class="slt-drow">✅ ${h.why}</div>`:'')
      +(h.cav?`<div class="slt-drow cav">⚠️ ${h.cav}</div>`:'')
      +(h.vnote?`<div class="slt-drow">${h.vnote}</div>`:'')
      +`<div class="slt-links">${links}</div></div>`;
  }).join('')+'</div>';
}
function slCard(h,i,L){
  const top=i<3;
  const bk=slBook(h.book,L.ci,L.co),ag=slAgoda(h.agoda,h.name,L.city,L.ci,L.los),ht=slHotels(h.name,L.city,L.ci,L.co),tp=slTrip(h.name,L.city,L.ci,L.co),gg=slGoogle(h.name,L.city,L.ci,L.co),mp=slMaps(h.name,L.city);
  let badges=(h.hold?'<span class="sl-b hold">🔒 가예약 보유</span>':h.ver===false?'':top?'<span class="sl-b ver">✔ 적대검증</span>':'')+'<span class="sl-b cancel">무료취소 '+h.cancel+'</span>'+(h.stars>0?'<span class="sl-b star">'+'★'.repeat(h.stars)+'</span>':'<span class="sl-b">B&B/게스트하우스</span>');
  let links='<a class="sl-lk book" target="_blank" rel="noopener" href="'+bk+'">Booking ▸날짜</a>'
    +'<a class="sl-lk agoda" target="_blank" rel="noopener" href="'+ag+'">Agoda ▸날짜</a>'
    +'<a class="sl-lk" target="_blank" rel="noopener" href="'+ht+'">Hotels.com</a>'

function toggleSegRoute(ev,dayNum,si){

  if(dayLine){dayMap.removeLayer(dayLine);dayLine=null;}

function flyToPoint(lat,lng,name){

  dayMarkers.forEach(m=>{

    const base=m._baseLatLng||[m.getLatLng().lat,m.getLatLng().lng];

    if(nameMatch&&Math.abs(base[0]-lat)<0.001&&Math.abs(base[1]-lng)<0.001){

    }

function limitMarkerOffset(dx,dy,max=56){
  const dist=Math.hypot(dx,dy);
  if(dist<=max)return {dx,dy};
  const scale=max/dist;
  return {dx:dx*scale,dy:dy*scale};
}
function markerLabelOffsets(points){
  if(!dayMap)return points.map(()=>({dx:0,dy:0}));
  const mapSize=dayMap.getSize();
  const entries=points.map((p,i)=>({i,point:dayMap.latLngToLayerPoint(p.latlng),width:String(p.markerLabel).length>2?34:24}));
  const markerBodiesOverlap=(a,b)=>{
    const dx=Math.abs(a.point.x-b.point.x);
    const dy=Math.abs(a.point.y-b.point.y);
    return dx<(a.width+b.width)/2+2&&dy<26;
  };
  const clusters=[];
  entries.forEach(e=>{
    const group=clusters.find(g=>g.some(x=>markerBodiesOverlap(x,e)));
    if(group)group.push(e);else clusters.push([e]);
  });
  const offsets=points.map(()=>({dx:0,dy:0}));
  clusters.forEach(group=>{
    if(group.length<2)return;
    group.sort((a,b)=>a.i-b.i);
    const center=group.reduce((acc,e)=>({x:acc.x+e.point.x,y:acc.y+e.point.y}),{x:0,y:0});
    center.x/=group.length;center.y/=group.length;
    const nearTop=center.y<86;
    const nearBottom=center.y>mapSize.y-86;
    const perRow=group.length<=3?group.length:3;
    const labelGap=18;
    for(let start=0,row=0;start<group.length;start+=perRow,row++){
      const rowItems=group.slice(start,start+perRow);
      const rowWidth=rowItems.reduce((sum,e)=>sum+e.width,0)+(rowItems.length-1)*labelGap;
      let left=-rowWidth/2;
      if(center.x+left<14)left=14-center.x;
      if(center.x+left+rowWidth>mapSize.x-14)left=mapSize.x-14-center.x-rowWidth;
      let y;
      if(nearTop)y=34+row*30;
      else if(nearBottom)y=-34-row*30;
      else y=(row%2===0?-1:1)*(34+Math.floor(row/2)*30);
      let cursor=left;
      rowItems.forEach(e=>{
        const labelX=center.x+cursor+e.width/2;
        const labelY=center.y+y;
        offsets[e.i]=limitMarkerOffset(labelX-e.point.x,labelY-e.point.y);
        cursor+=e.width+labelGap;
      });
    }
  });
  return offsets;
}
function renderRouteSupportMarkers(routeItems,anchorItems){
  if(!dayMap)return;
  // 구간 포커스 중엔 화살표를 포커스 구간에만 — zoomend 리프레시가 전체 화살표를 되살리던 버그 방지
  const pairs=[];
  if(segFocus&&segFocusPair){pairs.push([segFocusPair.prev,segFocusPair.cur]);}
  else{for(let i=1;i<routeItems.length;i++)pairs.push([routeItems[i-1],routeItems[i]]);}
  for(const [prev,cur] of pairs){
    if(!prev||!cur||sameCoords(prev,cur))continue;
    const a=[Number(prev.coords[0]),Number(prev.coords[1])],b=[Number(cur.coords[0]),Number(cur.coords[1])];
    // 화살표는 실경로의 거리 기준 중간 정점에, 방향은 그 지점의 국소 진행방향으로
    const path=realPath([a,b]);
    let f=a,t2=b,mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    if(path.length>=3){
      const cum=[0];let tot=0;
      for(let j=1;j<path.length;j++){const dy=path[j][0]-path[j-1][0],dx=(path[j][1]-path[j-1][1])*Math.cos(path[j][0]*Math.PI/180);tot+=Math.hypot(dy,dx);cum.push(tot);}
      let k=1;while(k<path.length-1&&cum[k]<tot/2)k++;
      f=path[k-1];t2=path[k];mid=[(f[0]+t2[0])/2,(f[1]+t2[1])/2];
    }
    const p1=dayMap.latLngToLayerPoint(f),p2=dayMap.latLngToLayerPoint(t2);
    const angle=Math.atan2(p2.y-p1.y,p2.x-p1.x)*180/Math.PI;
    const detail=travelDetail(prev,cur);
    const mk=L.marker(mid,{icon:createRouteArrowIcon(angle)}).addTo(dayMap);
    mk._isArrow=true;
    mk._baseLatLng=mid;mk._pointName=`${pointLabel(prev)} → ${pointLabel(cur)}`;
    mk.bindPopup(`<b>이동</b><br><span style="color:#555;font-size:11px">${pointLabel(prev)} → ${pointLabel(cur)}${detail?` · ${detail}`:''}</span>`);
    dayMarkers.push(mk);
  }
  anchorItems.forEach(({s,latlng})=>{
    const mk=L.marker(latlng,{icon:createRouteAnchorIcon(s),zIndexOffset:-300}).addTo(dayMap);
    mk._baseLatLng=latlng;mk._pointName=s.name;
    let popup=`<b>${s.name}</b>`;
    if(s.t)popup=`<span style="color:#d97706;font-weight:700">${s.t}</span> `+popup;
    if(s.desc)popup+=`<br><span style="color:#555;font-size:11px">${s.desc}</span>`;
    if(Array.isArray(s.actions)&&s.actions.length)popup+=`<br>${s.actions.map(a=>`<a href="${a.u}" target="_blank" rel="noopener" style="display:inline-block;margin-top:4px;margin-right:4px;background:${a.kind==='train'?'#2F6B4F':'#1a73e8'};color:#fff;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;text-decoration:none">${a.t}</a>`).join('')}`;
    popup+=`<br><a href="https://www.google.com/maps/search/?api=1&query=${latlng[0]},${latlng[1]}" target="_blank" rel="noopener" style="display:inline-block;margin-top:4px;background:#1a73e8;color:#fff;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;text-decoration:none">📍 Google Maps 열기</a>`;
    mk.bindPopup(popup);
    dayMarkers.push(mk);
  });
}
function renderDayPointMarkers(mapItems,anchorItems=currentDayAnchorItems,routeItems=currentDayRouteItems){
  if(!dayMap)return;
  dayMarkers.forEach(m=>dayMap.removeLayer(m));dayMarkers=[];
  renderRouteSupportMarkers(routeItems,anchorItems);

    mk.bindPopup(popup);
    dayMarkers.push(mk);

}
function refreshDayPointMarkers(){
  if(!dayMap||(!currentDayMapItems.length&&!currentDayRouteItems.length))return;
  renderDayPointMarkers(currentDayMapItems,currentDayAnchorItems,currentDayRouteItems);
}
function showDayOnMap(day){
  if(!initDayMap())return;
  segFocus=null;segFocusPair=null;
  document.querySelectorAll('.sched-row.active-row').forEach(r=>r.classList.remove('active-row'));
  clearDayMap();
  const items=day.sched.filter(isMapPoint);
  const routeItems=day.sched.filter(isRoutePoint);
  const visiblePoints=[...routeItems,...items.filter(s=>!routeItems.includes(s))];
  if(visiblePoints.length===0){dayMap.setView([42.5,13],6);return;}
  const fitPoints=visiblePoints.filter(s=>s.fit!==false);
  const coords=(fitPoints.length?fitPoints:visiblePoints).map(s=>[Number(s.coords[0]),Number(s.coords[1])]);
  const mainCoords=routeItems.map(s=>[Number(s.coords[0]),Number(s.coords[1])]);
  const bounds=L.latLngBounds(coords);
  if(bounds.isValid())dayMap.fitBounds(bounds,{padding:[72,72],maxZoom:14});
  dayMap.invalidateSize();
  let num=0;
  const mapItems=items.map(s=>{
    if(!s.optional)num++;
    return {s,markerLabel:s.seq||(s.optional?`${num}-1`:num),latlng:[Number(s.coords[0]),Number(s.coords[1])]};
  });
  const numberedKeys=new Set(mapItems.map(item=>coordKeyFromCoords(item.latlng)));
  const anchorSeen=new Set();
  const anchorItems=[];
  routeItems.forEach(s=>{
    const key=coordKey(s);
    if(isMapPoint(s)||numberedKeys.has(key)||anchorSeen.has(key)||s.pin===false)return;
    anchorSeen.add(key);
    anchorItems.push({s,latlng:[Number(s.coords[0]),Number(s.coords[1])]});
  });
  if(mainCoords.length>1){
    const rp=realPath(mainCoords);const isReal=rp.length>mainCoords.length;
    dayLine=L.polyline(rp,isReal?{color:'#2563eb',weight:3,opacity:.72}:{color:'#2563eb',weight:2.5,opacity:.62,dashArray:'6 4'}).addTo(dayMap);
  }
  currentDayMapItems=mapItems;currentDayRouteItems=routeItems;currentDayAnchorItems=anchorItems;
  renderDayPointMarkers(currentDayMapItems,currentDayAnchorItems,currentDayRouteItems);
}
function showOverviewOnDayMap(c){
  if(!initDayMap())return;
  clearDayMap();
  const cs=c.cities.filter(x=>Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.lng))),coords=cs.map(x=>[Number(x.lat),Number(x.lng)]);
  cs.forEach(x=>{
    const r=x.n===0?4:Math.max(6,x.n*3+3);
    const m=L.circleMarker([Number(x.lat),Number(x.lng)],{radius:r,fillColor:x.color,color:'#333',weight:x.n?2:1,fillOpacity:x.n?.7:.3}).addTo(dayMap);
    m.bindPopup(`<b>${x.name}</b><br>${x.dates}<br>${x.n?x.n+'박':'경유'}`);
    dayMarkers.push(m);
  });
  if(coords.length>1){
    dayLine=L.polyline(coords,{color:'#2563eb',weight:2,opacity:.4,dashArray:'8 6'}).addTo(dayMap);
  }
  const bounds=L.latLngBounds(coords);if(bounds.isValid())dayMap.fitBounds(bounds,{padding:[30,30],maxZoom:7});
}

function getKstTodayYmd(){

function bookingDetailHtml(item){

function mdBold(x){return String(x==null?'':x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function bkNote(x){
  if(x==null||x==='')return '';
  const t=mdBold(x);
  const bal=a=>a.every(p=>(p.match(/<b>/g)||[]).length===(p.match(/<\/b>/g)||[]).length);
  let parts=t.split(' · ').map(v=>v.trim()).filter(Boolean);
  // ' · ' 구분이 없는 긴 줄글은 문장 단위로 분해 (소수점·태그 중간은 건드리지 않음)
  if(parts.length<3&&t.length>140){
    const alt=t.split(/(?<=[.。])\s+(?=\S)/).map(v=>v.trim()).filter(Boolean);
    if(alt.length>2&&bal(alt))parts=alt;
  }
  if(!bal(parts))parts=[t];
  return parts.length>2?`<ul class="bk-note">${parts.map(v=>`<li>${v}</li>`).join('')}</ul>`:`<div class="bk-note one">${t}</div>`;
}

  const firstCls=shown.length?shown[0].g.cls:'';
  const strip=`<div class="bk-tabs">${shown.map(c=>`<button class="bk-tab ${c.g.cls}${c.g.cls===firstCls?' active':''}" data-bkg="${c.g.cls}" onclick="showBookingGroup(this.dataset.bkg)">${c.g.icon} ${c.g.label.split(' (')[0]} <b>${c.items.length}</b></button>`).join('')}</div>`;
  // ── 마감 타임라인 (TICKETING_ITEMS)
  const ev=TICKETING_ITEMS.map((x,i)=>({...x,idx:i})).filter(x=>x.ymd);
  const isDone=x=>/✅|완료|취소됨/.test((x.date||'')+(x.name||''));
  const future=ev.filter(x=>!isDone(x)&&ymdDays(x.ymd)>=todayD).sort((a,b)=>ymdDays(a.ymd)-ymdDays(b.ymd));
  const past=ev.filter(x=>isDone(x)||ymdDays(x.ymd)<todayD).sort((a,b)=>ymdDays(a.ymd)-ymdDays(b.ymd));
  const selIdx=future.length?future[0].idx:(ev.length?ev[ev.length-1].idx:0);
  const chip=e=>{const d=ymdDays(e.ymd)-todayD;const dd=isDone(e)?'✅ 완료':d===0?'오늘':d>0?'D-'+d:'지남';
    return `<button class="btl-chip ${e.tone==='critical'?'crit':''} ${(d<0||isDone(e))?'past':''}${e.idx===selIdx?' active':''}" data-booking-idx="${e.idx}" onclick="selectBookingEvent(${e.idx})"><span class="btl-date">${e.ymd.slice(5).replace('-','/')}</span><span class="btl-name">${bookingIcon(e.name)} ${e.name.replace(/\s*\(.*?\)\s*/g,' ').trim()}</span><span class="btl-dd ${d===0?'today':d<0?'past':d<=14?'soon':''}">${dd}</span></button>`;};
  const months=[...new Set(future.map(x=>x.ymd.slice(0,7)))];
  const tl=months.map(mn=>`<div class="btl-month"><div class="btl-mh">${Number(mn.slice(0,4))}년 ${Number(mn.slice(5))}월</div><div class="btl-chips">${future.filter(x=>x.ymd.slice(0,7)===mn).map(chip).join('')}</div></div>`).join('');
  const tlPast=past.length?`<details class="btl-past"><summary>지난·완료 항목 ${past.length}건 보기</summary><div class="btl-chips">${past.map(chip).join('')}</div></details>`:'';
  const nextH=future.length?(()=>{const d=ymdDays(future[0].ymd)-todayD;return `<div class="bcal-next">⏰ 다음 마감 <b>${d===0?'오늘':'D-'+d}</b> · ${future[0].ymd.slice(5).replace('-','/')} ${future[0].name.replace(/\s*\(.*?\)\s*/g,' ').trim()}</div>`;})():'';
  // ── 상태 그룹별 통합 리스트 (행 클릭 → 상세 펼침)
  const list=counts.map(({g,items})=>{
    if(!items.length)return '';
    const rows=items.map(it=>{const w=bkWhen(it);return `<details class="bk-row ${g.cls}"><summary><span class="bk-cat">${it.cat}</span><span class="bk-title">${it.title}</span>${w?`<span class="bk-when">🗓 ${w.t}</span>`:''}<span class="bk-target">${it.target}</span><span class="bk-status ${g.cls}">${it.status}</span></summary><div class="bk-detail"><div class="bk-drow"><strong>조건</strong><div class="bk-note one">${mdBold(it.window)}</div></div><div class="bk-drow"><strong>메모</strong>${bkNote(it.note)}</div>${it.link?`<a class="booking-link" href="${it.link}" target="_blank" rel="noopener">${it.linkText} 열기 ↗</a>`:''}</div></details>`;}).join('');
    return `<div class="bk-group" id="bkg-${g.cls}" data-bkgroup="${g.cls}"${g.cls===firstCls?'':' hidden'}><div class="bk-ghead ${g.cls}">${g.icon} ${g.label}<span class="cnt">${items.length}건</span></div>${rows}</div>`;
  }).join('');
  el.innerHTML=`<div class="booking-meta">📅 오늘 ${today} (KST) · 이탈리아 9월은 한국보다 7시간 느림</div>${nextH}<div class="ticket-title">⏰ 마감 타임라인 — 칩을 누르면 아래 상세가 바뀝니다</div>${tl}${tlPast}<div id="bookingDetail">${bookingDetailHtml(TICKETING_ITEMS[selIdx])}</div><div class="ticket-title" style="margin-top:24px">🗂 전체 예약 현황 — 탭으로 상태를 고르고, 행을 누르면 상세가 펼쳐집니다</div>${strip}${list}`;
}

// HOTELS
// 친퀘테레/베네치아/코르티나/밀라노는 SL(10개 후보) 데이터로 렌더, 로마/피렌체는 확정 카드로 렌더
function slForCity(cityKey){
  if(/Cinque Terre/i.test(cityKey))return SL.find(s=>s.key==='Monterosso');
  if(/Venezia/i.test(cityKey))return SL.find(s=>s.key==='Venezia');
  if(/Cortina/i.test(cityKey))return SL.find(s=>s.key==='Cortina');
  if(/Gardena|Ortisei/i.test(cityKey))return SL.find(s=>s.key==='Gardena');
  if(/Milano/i.test(cityKey))return SL.find(s=>s.key==='Milano');
  return null;
}
function renderHotels(c){
  const el=document.getElementById('hotelContent');
  document.getElementById('hotelTitle').textContent='숙소';
  const cities=Object.keys(c.hotels);

    tl+=`<div class="lt-cell ${cls}"><div class="lt-d">9/${d}</div>${n||'—'}</div>`;
  }
  tl+='</div>';
  const cost=`<div class="lodge-cost"><h5>💶 숙박비 집계</h5><div class="lc-table">${LODGING.rows.map(r=>`<div class="lc-row"><span class="lc-city">${r.city}</span><span class="lc-st">${r.st}</span><span class="lc-amt">${r.amt}</span></div>`).join('')}<div class="lc-row total"><span class="lc-city">합계</span><span class="lc-st">${LODGING.totalSub}</span><span class="lc-amt">${LODGING.total}</span></div></div><ul class="lc-notes">${LODGING.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`;
  let blocks='';

    if(L&&!conf(city)){ // 예약 확정된 도시는 후보 그리드 대신 확정 카드만 (후보 데이터는 SL에 보관)
      inner=`<div class="sl-banner">${L.summary}</div>${slTable(L)}`;
      count=`후보 ${L.hotels.length}곳 · ${L.ci}→${L.co}`;
    }else{
      const cards=c.hotels[city].map(h=>{
        const stars='★'.repeat(h.stars)+'☆'.repeat(5-h.stars);
        const tags=h.tags.map(t=>`<span class="h-tag">${t}</span>`).join('');
        const links=h.links.map(l=>`<a href="${l.u}" target="_blank" rel="noopener" class="${l.c||''}">${l.t}</a>`).join('');
        const info=[["📅",h.dates],["📍",h.addr],["📞",h.tel?`<a href="tel:${h.tel.replace(/\s/g,'')}">${h.tel}</a>`:null],["🛬",h.arrive],["🛫",h.depart],["🥐",h.breakfast],["🛎️",h.reception],["🧳",h.luggage],["🏛️",h.tax]]
          .filter(x=>x[1]).map(x=>`<div class="h-info"><span class="hi-ic">${x[0]}</span><span>${x[1]}</span></div>`).join('');
        if(info)return `<div class="hotel-card wide"><div class="hc-main"><div class="h-name">${h.name}</div><div class="h-stars">${stars}</div><div class="h-desc">${h.desc}</div><div class="h-price">${h.price} <small>/2인 기준</small></div><div class="h-tags">${tags}</div><div class="h-links">${links}</div></div><div class="hc-side">${info}</div></div>`;
        return `<div class="hotel-card"><div class="h-name">${h.name}</div><div class="h-stars">${stars}</div><div class="h-desc">${h.desc}</div><div class="h-price">${h.price} <small>/2인 기준</small></div><div class="h-tags">${tags}</div><div class="h-links">${links}</div></div>`;
      }).join('');
      inner=`<div class="hotel-cards">${cards}</div>`;

  el.innerHTML=tl+cost+nav+blocks+tip;
}

  const fmtW=v=>'₩'+Math.round(v).toLocaleString();
  const all=BUDGET_DETAIL.flatMap(g=>g.items);
  const sumK=f=>all.filter(f).reduce((s,i)=>s+kOf(i),0);
  const totK=sumK(()=>true),paidK=sumK(i=>i.st==='확정'),lockK=sumK(i=>i.st==='고정'),estK=sumK(i=>i.st==='추정');
  const restEur=all.filter(i=>i.st!=='확정'&&i.eur!=null).reduce((s,i)=>s+i.eur,0);
  document.getElementById('budgetTitle').textContent=`예산 상세 (2인 · 원화 기준 · 적용 환율 ${R.toLocaleString()}원/€)`;
  const stChip=s=>`<span class="bgt-st ${s==='확정'?'done':s==='고정'?'lock':'est'}">${s==='확정'?'✅ 지출확정':s==='고정'?'📌 가격고정':'📊 추정'}</span>`;
  const head=`<div class="bgt-summary">
    <div class="bgt-tile main"><div class="v">₩${fmtM(totK)}</div><div class="l">총 예산 (2인)</div><div class="s">1인 ₩${fmtM(totK/2)} · €${Math.round(totK/R).toLocaleString()} 상당</div></div>
    <div class="bgt-tile done"><div class="v">₩${fmtM(paidK)}</div><div class="l">✅ 이미 지출 (환율 무관)</div><div class="s">전체의 ${Math.round(paidK/totK*100)}% — 결제·발권 완료분</div></div>
    <div class="bgt-tile lock"><div class="v">₩${fmtM(lockK)}</div><div class="l">📌 가격 고정 (유로, 미결제)</div><div class="s">전체의 ${Math.round(lockK/totK*100)}%</div></div>
    <div class="bgt-tile est"><div class="v">₩${fmtM(estK)}</div><div class="l">📊 추정치</div><div class="s">전체의 ${Math.round(estK/totK*100)}% — 숙소·렌터카 확정 시 축소</div></div>
  </div>
  <div class="bgt-fx">💱 남은 유로 지출 €${restEur.toLocaleString()} — 환율이 100원 움직이면 총예산 ±₩${Math.round(restEur*100/10000).toLocaleString()}만 변동</div>
  <div class="bgt-stack">${BUDGET_DETAIL.map(g=>{const gs=g.items.reduce((s,i)=>s+kOf(i),0);return `<span class="bgt-seg" style="width:${(gs/totK*100).toFixed(1)}%;background:${g.c}" title="${g.cat} ₩${fmtM(gs)}"></span>`;}).join('')}</div>
  <div class="bgt-legend">${BUDGET_DETAIL.map(g=>{const gs=g.items.reduce((s,i)=>s+kOf(i),0);return `<span><i style="background:${g.c}"></i>${g.cat} ${Math.round(gs/totK*100)}%</span>`;}).join('')}</div>`;
  const groups=BUDGET_DETAIL.map(g=>{
    const gs=g.items.reduce((s,i)=>s+kOf(i),0);
    const rows=g.items.map(i=>`<div class="bgt-row"><div class="bgt-n">${i.n}${i.note?`<span class="bgt-note">${i.note}</span>`:''}</div>${stChip(i.st)}<div class="bgt-amt"><b>${fmtW(kOf(i))}</b><span>${i.krw!=null?'실결제 확정':'€'+i.eur.toLocaleString()+' × '+R.toLocaleString()}</span></div></div>`).join('');

  }).join('');
  el.innerHTML=head+groups+`<div class="bgt-foot">원화 결제 완료분(항공·숙소 3건)은 실결제액 고정 — 환율과 무관 · 유로 항목만 적용환율(${R.toLocaleString()}원/€)로 환산.</div>`;
}

// COMPARE
function renderCompare(){
  const g=document.getElementById('compareGrid');g.innerHTML='';
  COMPARE.forEach(c=>{const card=document.createElement('div');card.className='compare-card'+(c.id===currentCourse?' current':'');
    let pros=c.pros.map(p=>`<li>✅ ${p}</li>`).join(''),cons=c.cons.map(p=>`<li>❌ ${p}</li>`).join('');
    card.innerHTML=`${c.id===currentCourse?`<div class="card-badge">${c.status||'검토중'}</div>`:''}<h4>${c.name}</h4><div class="card-sub">${c.sub}</div><div class="card-route">${c.route}</div><div class="card-price">${c.krw} <small>/ 2인 (${c.price})</small></div><div style="font-size:11px;color:#666">1인당 ${c.pp} (항공 포함)</div><ul class="pros">${pros}</ul><ul class="cons" style="margin-top:6px">${cons}</ul>`;
    card.onclick=()=>switchCourse(c.id);g.appendChild(card);});
}

const _q=new URLSearchParams(location.search);

const _L=LANG==='it'?1:0;

const DOW_MAP={'월':['Mon','lun'],'화':['Tue','mar'],'수':['Wed','mer'],'목':['Thu','gio'],'금':['Fri','ven'],'토':['Sat','sab'],'일':['Sun','dom']};
const MONTHS=[['January','February','March','April','May','June','July','August','September','October','November','December'],
              ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre']];
function _lookup(k){
  if(I18N[k])return I18N[k][_L];
  // 요일만 한글인 노드: "9/16 수", "9/23(수)~28(월)" 등
  if(/[월화수목금토일]/.test(k)&&!/[가-힣]/.test(k.replace(/[월화수목금토일]/g,'')))
    return k.replace(/[월화수목금토일]/g,c=>DOW_MAP[c][_L]);
  let m;
  if(m=k.match(/^(\d{4})년 (\d{1,2})월$/))return _L?`${MONTHS[1][+m[2]-1]} ${m[1]}`:`${MONTHS[0][+m[2]-1]} ${m[1]}`;
  if(m=k.match(/^(.*)\((\d+)박\)(.*)$/))return `${m[1]}(${m[2]} ${+m[2]===1?(_L?'notte':'night'):(_L?'notti':'nights')})${m[3]}`;
  if(m=k.match(/^(\d+)박$/))return `${m[1]} ${+m[1]===1?(_L?'notte':'night'):(_L?'notti':'nights')}`;
  if(m=k.match(/^(\d+)건$/))return `${m[1]} ${_L?'voci':'items'}`;
  if(m=k.match(/^지난·완료 항목 (\d+)건 보기$/))return _L?`Mostra ${m[1]} voci passate/fatte`:`Show ${m[1]} past/done items`;
  if(m=k.match(/^후보 (\d+)곳(.*)$/))return (_L?`${m[1]} opzioni`:`${m[1]} options`)+m[2];
  if(m=k.match(/^▼ (\d+)곳 추천$/))return _L?`▼ ${m[1]} consigli`:`▼ ${m[1]} picks`;
  if(m=k.match(/^( ?· ?\d{2}\/\d{2} )(.+)$/)){const r=_lookup(m[2].trim());if(r!=null)return m[1]+r;}
  if(/[가-힣]/.test(k)&&!/[가-힣]/.test(k.replace(/박/g,'')))return k.replace(/(\d+)박/g,(w,n)=>`${n} ${+n===1?(_L?'notte':'night'):(_L?'notti':'nights')}`);
  if(m=k.match(/^(.+?) 열기( ↗)?$/)){const r=_lookup(m[1].trim())??m[1];return (_L?`Apri ${r}`:`Open ${r}`)+(m[2]||'');}
  if(/[가-힣]/.test(k)&&!/[가-힣]/.test(k.replace(/[박인]/g,'')))return k.replace(/(\d+)박/g,(w,n)=>`${n} ${+n===1?(_L?'notte':'night'):(_L?'notti':'nights')}`).replace(/(\d+)인/g,(w,n)=>_L?`${n} pers.`:`${n} pax`);
  if(m=k.match(/^숙박비 집계 — 확정 (.+)$/))return _L?`Totale alloggi confermati: ${m[1]}`:`Lodging booked total: ${m[1]}`;
  if(m=k.match(/^([\d,]+)만원$/))return '₩'+(parseFloat(m[1].replace(/,/g,''))/100).toFixed(2)+'M'; // 만원 → ₩0.00M
  if(m=k.match(/^€([\d,]+) 상당 @([\d,]+)$/))return `≈ €${m[1]} @ ₩${m[2]}/€`;
  return null;
}
function _trText(t){
  const k=t.trim();
  if(!k||!/[가-힣]/.test(k))return null;
  let v=_lookup(k);
  if(v==null){ // 접두 토큰을 하나씩 벗기며 재시도 (이모지·라틴 접두 대응)
    const toks=k.split(' ');
    for(let i=1;i<toks.length&&i<8&&v==null;i++){
      if(/[가-힣]/.test(toks.slice(0,i).join(' ')))break;
      const r=_lookup(toks.slice(i).join(' '));
      if(r!=null)v=toks.slice(0,i).join(' ')+' '+r;
    }
  }
  if(v==null){ // 접미 기호 제거 후 재시도
    const m=k.match(/^(.*[가-힣])([^가-힣]+)$/);
    if(m){const r=_lookup(m[1].trim());if(r!=null)v=r+m[2];}
  }
  if(v==null)return null;
  return t.replace(k,v);
}
function _trWalk(n){
  if(n.nodeType===3){const r=_trText(n.nodeValue);if(r!=null&&r!==n.nodeValue)n.nodeValue=r;return;}
  if(n.nodeType!==1)return;
  if(n.tagName==='SCRIPT'||n.tagName==='STYLE')return;
  for(const c of n.childNodes)_trWalk(c);
}
function applyLangNow(){
  if(LANG==='ko')return;
  document.title=LANG==='it'?'Italia 2026 — Piano di viaggio':'Italy 2026 — Trip Planner';
  _trWalk(document.body);
  new MutationObserver(ms=>{for(const m of ms){if(m.addedNodes)m.addedNodes.forEach(_trWalk);if(m.type==='characterData'){const r=_trText(m.target.nodeValue);if(r!=null&&r!==m.target.nodeValue)m.target.nodeValue=r;}}}).observe(document.body,{childList:true,subtree:true,characterData:true});
}

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('theme',t);
  const b=document.getElementById('themeBtn');if(b)b.textContent=t==='dark'?'☀️':'🌙';
}

  w.appendChild(tb);

  applyTheme(localStorage.getItem('theme')||'light');
})();
